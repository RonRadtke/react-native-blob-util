buildscript {
    // Fallbacks for when the host app does not set these on rootProject.ext. They
    // match React Native 0.84.1's own version catalog.
    ext.ReactNativeBlobUtil = [
        kotlinVersion    : '2.1.20',
        minSdkVersion    : 24,
        compileSdkVersion: 36,
    ]

    ext.getExtOrDefault = { prop ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : ReactNativeBlobUtil[prop]
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // noinspection DifferentKotlinGradleVersion
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    }
}

apply plugin: 'com.android.library'

// AGP 9 can compile Kotlin itself. A host that turns that on already has the
// kotlin extension, and applying the plugin a second time fails the build; a
// host that keeps android.builtInKotlin=false (the React Native 0.87 template
// does) needs it applied here.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

// Required: the module is a TurboModule only (New Architecture), and this plugin
// runs codegen over codegenSpecs/ to generate NativeBlobUtilsSpec.
apply plugin: 'com.facebook.react'

android {
    namespace 'com.ReactNativeBlobUtil'
    compileSdkVersion getExtOrDefault('compileSdkVersion')

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

}

// Pin the Kotlin bytecode target to the Java one. Left alone, Kotlin targets the
// JDK that runs Gradle, and the build then fails on the Java/Kotlin mismatch.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
}
